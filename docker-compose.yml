services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ai:
    build:
      context: "./VM AI (NEW)"
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      CORS_ORIGINS: "http://localhost:5000,http://localhost:5173"
    volumes:
      - ai_models:/app/models

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/visionmesh
      AI_SERVICE_URL: http://ai:5001
      NODE_ENV: production
    depends_on:
      - mongodb
      - ai

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:5000
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  ai_models:

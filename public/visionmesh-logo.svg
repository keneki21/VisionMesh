<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#0a0a0a"/>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e50914;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b20710;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="whiteGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cccccc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Mesh Grid Background (subtle) -->
  <g opacity="0.15">
    <line x1="150" y1="80" x2="650" y2="80" stroke="#e50914" stroke-width="0.5"/>
    <line x1="150" y1="140" x2="650" y2="140" stroke="#e50914" stroke-width="0.5"/>
    <line x1="150" y1="200" x2="650" y2="200" stroke="#e50914" stroke-width="0.5"/>
    <line x1="150" y1="260" x2="650" y2="260" stroke="#e50914" stroke-width="0.5"/>
    <line x1="150" y1="320" x2="650" y2="320" stroke="#e50914" stroke-width="0.5"/>
    
    <line x1="200" y1="80" x2="200" y2="320" stroke="#e50914" stroke-width="0.5"/>
    <line x1="300" y1="80" x2="300" y2="320" stroke="#e50914" stroke-width="0.5"/>
    <line x1="400" y1="80" x2="400" y2="320" stroke="#e50914" stroke-width="0.5"/>
    <line x1="500" y1="80" x2="500" y2="320" stroke="#e50914" stroke-width="0.5"/>
    <line x1="600" y1="80" x2="600" y2="320" stroke="#e50914" stroke-width="0.5"/>
  </g>
  
  <!-- Main Logo: V + M Combined -->
  <g transform="translate(400, 200)" filter="url(#strongGlow)">
    
    <!-- Letter V (white with gradient) -->
    <path d="M -90 -60 L -50 40 L -10 -60" 
          stroke="url(#whiteGradient)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>
    
    <!-- Letter M (red with gradient) - overlapping with V -->
    <path d="M 10 40 L 10 -60 L 50 0 L 90 -60 L 90 40" 
          stroke="url(#redGradient)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>
    
    <!-- Connecting Mesh Lines between V and M -->
    <line x1="-10" y1="-60" x2="10" y2="-60" stroke="#e50914" stroke-width="2" opacity="0.6"/>
    <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#e50914" stroke-width="1.5" opacity="0.4"/>
    <line x1="-50" y1="40" x2="10" y2="40" stroke="#e50914" stroke-width="2" opacity="0.6"/>
    
    <!-- Decorative Nodes -->
    <circle cx="-10" cy="-60" r="4" fill="#e50914" opacity="0.8"/>
    <circle cx="10" cy="-60" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="-50" cy="40" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="10" cy="40" r="4" fill="#e50914" opacity="0.8"/>
    <circle cx="90" cy="40" r="4" fill="#e50914" opacity="0.8"/>
    
    <!-- Mesh Grid Pattern Inside -->
    <g opacity="0.3">
      <line x1="-70" y1="-30" x2="70" y2="-30" stroke="#e50914" stroke-width="1"/>
      <line x1="-60" y1="0" x2="80" y2="0" stroke="#e50914" stroke-width="1"/>
      <line x1="-40" y1="20" x2="60" y2="20" stroke="#e50914" stroke-width="1"/>
    </g>
  </g>
  
  <!-- VisionMesh Text -->
  <text x="400" y="350" 
        font-family="Arial, sans-serif" 
        font-size="52" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle"
        filter="url(#glow)"
        letter-spacing="2">
    Vision<tspan fill="#e50914">Mesh</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="400" y="385" 
        font-family="Arial, sans-serif" 
        font-size="13" 
        fill="#b3b3b3" 
        text-anchor="middle"
        letter-spacing="3">
    ANALYZING AND WEAVING BETTER VISUALS
  </text>
  
  <!-- Corner Tech Accents -->
  <g opacity="0.5">
    <path d="M 50 50 L 50 85 M 50 50 L 85 50" stroke="#e50914" stroke-width="2.5"/>
    <path d="M 750 50 L 750 85 M 750 50 L 715 50" stroke="#e50914" stroke-width="2.5"/>
    <path d="M 50 400 L 50 365 M 50 400 L 85 400" stroke="#e50914" stroke-width="2.5"/>
    <path d="M 750 400 L 750 365 M 750 400 L 715 400" stroke="#e50914" stroke-width="2.5"/>
    
    <!-- Additional corner details -->
    <circle cx="50" cy="50" r="3" fill="#e50914"/>
    <circle cx="750" cy="50" r="3" fill="#e50914"/>
    <circle cx="50" cy="400" r="3" fill="#e50914"/>
    <circle cx="750" cy="400" r="3" fill="#e50914"/>
  </g>
  
  <!-- Decorative Scan Line -->
  <line x1="100" y1="200" x2="700" y2="200" stroke="#e50914" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>